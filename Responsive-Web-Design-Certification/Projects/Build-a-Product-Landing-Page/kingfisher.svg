    <path d="M321 190c-8-53 19-98 66-117 43-18 95-6 120 30 18 26 18 59 3 85-47-20-112-19-189 2Z" fill="#a3ad7d" stroke-width="8"/>
    <path d="M364 116c25-31 63-45 99-36-28 14-48 36-59 63Z" fill="#b96347" stroke-width="6"/>
    <path d="m494 169 113 17-116 24c10-13 11-27 3-41Z" fill="#b96347" stroke-width="8"/>
    <path d="M375 181c17-20 44-25 66-13-18 5-30 17-37 32-12-3-22-9-29-19Z" fill="#fffefa" stroke="none"/>
    <circle cx="415" cy="174" r="7" fill="#24231f" stroke="none"/>
  </g>
</svg>
